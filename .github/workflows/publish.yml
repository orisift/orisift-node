name: Stage a release for approval

# Publishing is a deliberate act, not a consequence of merging.
#
# A tag triggers it, and the tag has to agree with package.json before anything
# is sent. workflow_dispatch is here so a failed run can be repeated without
# inventing a tag, and it publishes the same checked-out commit.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# The whole point of trusted publishing: no npm token exists anywhere in this
# repository or its secrets. `id-token: write` lets the runner ask GitHub for a
# short-lived OIDC token, npm verifies it came from this workflow in this
# repository, and the credential dies with the job.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only GitHub-hosted runners can issue an OIDC token npm will accept. A
    # self-hosted runner fails authentication, so this must not be changed to
    # one without also going back to a token.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Staged publishing requires Node 22.14.0 or later ON THE RUNNER.
          # That is a requirement of the publishing mechanism and has nothing to
          # do with what the package supports, which is Node 20 and later.
          # Pinned to the minimum that satisfies it rather than to "22", so a
          # future 22.x that somehow regressed below the floor would fail here
          # rather than at staging time.
          node-version: "22.14"
          # No registry-url, deliberately.
          #
          # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` into an .npmrc
          # whenever registry-url is set. With no token secret, which is the
          # whole point of trusted publishing, that expands to an empty string,
          # npm decides authentication is already configured, and skips the OIDC
          # exchange. The first attempt at this release failed that way: the
          # provenance statement was signed and published to the transparency
          # log, and then the registry returned E401 on a token that was never
          # there.
          #
          # npmjs.org is the default registry, so dropping it changes nothing
          # else.

      # `npm install -g npm@latest` alone is an instruction, not a check: it can
      # succeed and still leave a CLI older than the one OIDC needs, and the
      # failure would then appear at publish time as an authentication error
      # that says nothing about versions. Install a floor, then verify it.
      #
      # 11.15.0, not 11.5.1: trusted publishing needs 11.5.1, but `npm stage
      # publish` needs 11.15.0, and this workflow stages rather than publishes.
      - name: Install and verify an npm that supports staged publishing
        run: |
          npm install -g "npm@>=11.15.0"
          NPM_VERSION="$(npm --version)"
          NODE_VERSION="$(node --version)"
          echo "npm $NPM_VERSION on node $NODE_VERSION"
          node -e '
            const [npmV, nodeV] = [process.argv[1], process.versions.node];
            const ge = (a, b) => {
              const x = a.split(".").map(Number), y = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) {
                if ((x[i] ?? 0) !== (y[i] ?? 0)) return (x[i] ?? 0) > (y[i] ?? 0);
              }
              return true;
            };
            if (!ge(npmV, "11.15.0")) {
              console.error(`npm ${npmV} is below 11.15.0, which staged publishing requires.`);
              process.exit(1);
            }
            if (!ge(nodeV, "22.14.0")) {
              console.error(`node ${nodeV} is below 22.14.0, which trusted publishing requires.`);
              process.exit(1);
            }
            console.log("npm and node both satisfy the trusted-publishing minimums.");
          ' "$NPM_VERSION"

      # Fail on the cause rather than the symptom.
      #
      # If anything ever puts an auth token back into an .npmrc, npm will use it
      # instead of OIDC and the run will die at the last step with "your
      # authentication token seems to be invalid", which describes a token that
      # does not exist and points at npm login. This says what is actually
      # wrong, before a tarball is built and a provenance statement is signed.
      - name: No npmrc auth token may exist, or OIDC is bypassed
        run: |
          FOUND=0
          for f in "$RUNNER_TEMP/.npmrc" "$HOME/.npmrc" ".npmrc"; do
            if [ -f "$f" ] && grep -q "_authToken" "$f"; then
              echo "$f contains an _authToken line, which disables trusted publishing."
              FOUND=1
            fi
          done
          if [ "$FOUND" = "1" ]; then
            echo "Remove it, or remove registry-url from actions/setup-node."
            exit 1
          fi
          echo "No _authToken anywhere. npm will use OIDC."

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: The tag must match the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG."
            echo "Publishing them apart would put a version on npm that no tag points at."
            exit 1
          fi
          echo "Tag and manifest agree on $PKG."

      - name: Refuse to publish a version that already exists
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm. Versions are immutable; bump it."
            exit 1
          fi
          echo "$NAME@$VERSION is not yet published."

      - name: What would be published
        run: npm pack --dry-run

      # Stage, do not publish.
      #
      # The trusted publisher for this package is configured with direct
      # publishing disabled, so this workflow can put a tarball into the staging
      # queue and nothing else. Making it live is a separate act performed by a
      # maintainer with 2FA, which no CI token can do.
      #
      # That is the point rather than an inconvenience. A compromised Action, a
      # malicious pull request that edits this file, or a stolen GitHub session
      # can at most leave a tarball awaiting approval. None of them can ship
      # code to anybody who runs `npm install`.
      #
      # No NODE_AUTH_TOKEN. The npm CLI detects the OIDC environment and
      # authenticates with it. Provenance comes from publishConfig, and is
      # generated because this repository is public.
      - name: Stage the release for approval
        run: npm stage publish

      - name: What is now waiting for a human
        if: success()
        run: |
          npm stage list || true
          echo ""
          echo "Staged. It is not live and nobody can install it yet."
          echo "Approve it from a terminal signed in to npm:"
          echo "  npm stage list"
          echo "  npm stage view <stage-id>"
          echo "  npm stage approve <stage-id>   # prompts for 2FA"
          echo "or discard it with: npm stage reject <stage-id>"
